<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui; width: 300px; padding: 12px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin-top: 8px; color: #555; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { margin-top: 10px; padding: 6px 10px; border: none; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    button.secondary { background: #eee; color: #111; }
    #status { margin-top: 8px; color: #555; min-height: 16px; }
    .row { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <h1>🧠 Aura</h1>
  <label>Aura URL <input id="url" placeholder="http://localhost:3100" /></label>
  <label>Connection token <input id="token" type="password" placeholder="aura_…" /></label>
  <div class="row"><button id="save">Save</button><button id="test" class="secondary">Test</button></div>

  <label>Quick capture <textarea id="capture" rows="2" placeholder="Something to remember…"></textarea></label>
  <div class="row"><button id="remember">Remember</button><button id="copy" class="secondary">Copy my context</button></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
